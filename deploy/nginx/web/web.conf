# ============================================================================
#  Servidor web: Good + sitios + panel admin  (tres "puertas")
#
#   PUBLICO  (tunel Cloudflare)  -> Good + sitios publicos
#   LAN      (LAN / Tailscale)   -> Good + sitios publicos y privados
#   ADMIN    (LAN / Tailscale)   -> panel de administracion (con login)
#
#  Lo que cambia entre el servidor y la PC de pruebas esta en web-entorno/:
#    entorno.conf       upstream php_fpm + raiz del proyecto ($web_raiz)
#    listen-*.conf      puertos de cada puerta
#    acceso-*.conf      quien puede entrar a cada puerta
# ============================================================================

# ---------------------------------------------------------------- PUBLICO ---
server {
    include web-entorno/listen-publico.conf;
    server_name _;
    include web-entorno/acceso-tunel.conf;

    set $alcance    publico;
    set $acceso_dir publico;
    client_max_body_size 1m;

    include web/sitios-comun.conf;
}

# -------------------------------------------------------------------- LAN ---
server {
    include web-entorno/listen-lan.conf;
    server_name _;
    include web-entorno/acceso-red.conf;

    set $alcance    local;
    set $acceso_dir local;
    client_max_body_size 1m;

    include web/sitios-comun.conf;
}

# ------------------------------------------------------------------ ADMIN ---
server {
    include web-entorno/listen-admin.conf;
    server_name _;
    include web-entorno/acceso-red.conf;

    set $alcance admin;
    root $web_raiz/admin;
    index index.php;
    # las subidas grandes van por partes de 8 MB
    client_max_body_size 24m;
    client_body_timeout 120s;
    fastcgi_read_timeout 300s;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location ~ /\.            { return 404; }
    location ~ ^/_media/(.+)$ { internal; alias $web_raiz/_datos/media/$1; }

    location = /              { rewrite ^ /index.php last; }
    location ~ ^/[a-z0-9_/-]+\.php$ {
        include web/fastcgi-php.conf;
    }
    location /assets/         { try_files $uri =404; }
    location /                { return 404; }
}
