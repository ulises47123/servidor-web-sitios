# Reglas compartidas por las puertas PUBLICO y LAN.
# Requiere: $web_raiz (entorno), $alcance y $acceso_dir (definidos en cada server).
# Lista blanca: solo existe "/", "/good/..." y "/sitios/<slug>/...". Todo lo demas da 404
# (asi _app, _datos, _backups, admin, etc. nunca se sirven).

root  $web_raiz;
index index.php index.html;
autoindex off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# Archivos y carpetas ocultas (.git, .env, .user.ini...)
location ~ /\. { return 404; }

# Multimedia protegida: solo via X-Accel-Redirect desde el PHP de cada sitio
location ~ ^/_media/(.+)$ { internal; alias $web_raiz/_datos/media/$1; }

# ---- Good (portada) ----
location = /                 { rewrite ^ /good/index.php last; }
location ~ ^/good/[a-z0-9_-]+\.php$ {
    include web/fastcgi-php.conf;
}
location = /good/            { rewrite ^ /good/index.php last; }
location /good/              { try_files $uri =404; }

# ---- Sitios: solo si tienen el marcador de acceso de esta puerta ----
# _datos/acceso/publico/<slug>  o  _datos/acceso/local/<slug>
location ~ ^/sitios/([a-z0-9][a-z0-9_-]*)$ {
    if (!-f $web_raiz/_datos/acceso/$acceso_dir/$1) { return 404; }
    return 301 $uri/;
}
location ~ ^/sitios/([a-z0-9][a-z0-9_-]*)/(.*\.php)$ {
    if (!-f $web_raiz/_datos/acceso/$acceso_dir/$1) { return 404; }
    include web/fastcgi-php.conf;
}
location ~ ^/sitios/([a-z0-9][a-z0-9_-]*)/ {
    if (!-f $web_raiz/_datos/acceso/$acceso_dir/$1) { return 404; }
    try_files $uri $uri/ =404;
}

location / { return 404; }
