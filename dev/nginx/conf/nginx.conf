# nginx de la PC de pruebas. Incluye la MISMA config que va al servidor (web/),
# copiada desde deploy/nginx/web por iniciar.ps1, y el entorno local (web-entorno/).
worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events { worker_connections 256; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      off;
    keepalive_timeout 30;
    access_log    logs/access.log;

    client_body_temp_path temp/client_body;
    fastcgi_temp_path     temp/fastcgi;
    proxy_temp_path       temp/proxy;
    scgi_temp_path        temp/scgi;
    uwsgi_temp_path       temp/uwsgi;

    include web-entorno/entorno.conf;
    include web/web.conf;
}
