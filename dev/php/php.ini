; PHP de la PC de pruebas (parecido al del servidor)
extension_dir = "ext"
extension = mysqli
extension = mbstring
extension = openssl
extension = fileinfo
date.timezone = America/Argentina/Buenos_Aires
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 300
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = "C:/Users/Usuario/Music/proyectos/servidor-web-sitios/dev/logs/php-error.log"
session.save_path = "C:/Users/Usuario/Music/proyectos/servidor-web-sitios/dev/tmp/sesiones"
upload_tmp_dir = "C:/Users/Usuario/Music/proyectos/servidor-web-sitios/dev/tmp"
cgi.fix_pathinfo = 0
expose_php = Off
opcache.enable = 0
